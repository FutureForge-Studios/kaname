# ------------------------------------------------------------------
# Kaname — the deployment install.sh creates.
#
# It is a plain Compose project with no build context, so it works from
# the files the installer puts in the data root and nothing else.
# Every image tag comes from .env, which is what makes an upgrade a
# configuration change the host-side updater can undo.
#
#   docker compose -p kaname -f /etc/kaname/docker-compose.yml up -d
#
# Caddy forwards /api and /agent to the control plane and everything
# else to the panel, so the browser and the agents both see exactly one
# origin. Its Caddyfile is generated by kaname-host.sh from the address
# in .env — plain HTTP on :80 until someone sets a domain from inside
# the panel, and :80 plus that domain afterwards.
# ------------------------------------------------------------------
name: kaname

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaname
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kaname
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaname -d kaname"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  control-plane:
    image: ${KANAME_IMAGE_CONTROL_PLANE:?set KANAME_IMAGE_CONTROL_PLANE in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KANAME_ENV: production
      KANAME_VERSION: ${KANAME_VERSION:-0.1.0}
      DATABASE_URL: postgres://kaname:${POSTGRES_PASSWORD}@postgres:5432/kaname
      KANAME_MASTER_KEY: ${KANAME_MASTER_KEY:?generated by install.sh; losing it loses every stored credential}
      KANAME_PUBLIC_URL: ${KANAME_PUBLIC_URL:?set the public URL in .env}
      KANAME_AGENT_URL: ${KANAME_AGENT_URL:-${KANAME_PUBLIC_URL}}
      KANAME_DOMAIN: ${KANAME_DOMAIN:-}
      # An install with no domain is served over plain HTTP, and a
      # Secure cookie is never stored over that: nobody could sign in.
      SECURE_COOKIES: ${KANAME_SECURE_COOKIES:-auto}
      KANAME_SETUP_TOKEN: ${KANAME_SETUP_TOKEN:-}
      KANAME_ALL_IN_ONE: ${KANAME_ALL_IN_ONE:-false}
      KANAME_DEPLOYMENT: compose
      KANAME_COMPOSE_PROJECT: ${KANAME_COMPOSE_PROJECT:-kaname}
      KANAME_DATA_DIR: ${KANAME_DATA_DIR:-/etc/kaname}
      PORT: 4000
      LOG_LEVEL: info
    ports:
      # Loopback only. This is what the agent on this host dials, what
      # the installer health-checks, and what the host-side updater
      # verifies after a restart. It is never reachable off the box.
      - "127.0.0.1:4000:4000"
    volumes:
      # The data root, so the control plane can read the environment it
      # is about to change, write rollback snapshots, and drop an update
      # request for the host-side updater to pick up. Mounted at the same
      # path it has on the host, so the paths in an update request mean
      # the same thing on both sides of the container boundary.
      - ${KANAME_DATA_DIR:-/etc/kaname}:${KANAME_DATA_DIR:-/etc/kaname}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  web:
    image: ${KANAME_IMAGE_WEB:?set KANAME_IMAGE_WEB in .env}
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KANAME_CONTROL_PLANE_URL: http://control-plane:4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, control-plane]
    ports:
      # 443 is bound from the first boot even though nothing answers on
      # it until a domain is set: adding a domain later must not need
      # the deployment file to change.
      - "80:80"
      - "443:443"
    volumes:
      # Generated by kaname-host.sh, not fetched. Changing the address
      # rewrites this file and recreates this container.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  postgres:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
