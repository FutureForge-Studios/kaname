# ==================================================================
# Cutting a release.
#
#   git tag -a v0.2.0 -m "What changed"
#   git push origin v0.2.0
#
# Images go to GHCR, agent binaries go to the GitHub release, and
# versions.json — the file a running instance reads to decide whether
# it may update itself — is regenerated and pushed back to main.
#
# The manifest lands only after the images do. It names image tags by
# reference, so publishing it first would point live instances at tags
# that do not exist yet.
# ==================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      registry: ${{ steps.derive.outputs.registry }}
      latest: ${{ steps.derive.outputs.latest }}
    steps:
      - name: Derive the version from the tag
        id: derive
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # A release candidate must not become what `:latest` resolves to.
          case "$version" in
            *-*) echo "latest=false" >>"$GITHUB_OUTPUT" ;;
            *) echo "latest=true" >>"$GITHUB_OUTPUT" ;;
          esac
          # The owner login is mixed case; a GHCR path may not be.
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "registry=ghcr.io/$owner" >>"$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing should not cancel the other: knowing both
      # results is what tells you whether the problem is shared.
      fail-fast: false
      matrix:
        include:
          - image: kaname-control-plane
            dockerfile: infra/Dockerfile.control-plane
            build-args: KANAME_VERSION=${{ needs.version.outputs.version }}
          - image: kaname-web
            dockerfile: infra/Dockerfile.web
            build-args: KANAME_CONTROL_PLANE_URL=http://control-plane:4000
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ needs.version.outputs.registry }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.latest == 'true' && format('{0}/{1}:latest', needs.version.outputs.registry, matrix.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the manifest commit is pushed back to main, and a
      # shallow clone cannot push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - run: pnpm install --frozen-lockfile

      - name: Build the agent binaries
        working-directory: agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "bin/kanamed-linux-$arch" ./cmd/kanamed
          done
          # An agent that reports the wrong version makes every fleet
          # update end in needs_attention, so the stamp is checked here.
          ./bin/kanamed-linux-amd64 version | grep -F "kanamed $VERSION " ||
            { echo "agent binary does not report $VERSION"; exit 1; }

      # main first, then generate. release-manifest.mjs prepends to the
      # manifest it finds on disk, and the tag's copy predates any
      # release recorded after it was cut — generating from the tag and
      # then committing that over main erases those.
      - name: Base the manifest on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout -f -B main origin/main

      # After the binaries exist: the manifest publishes a sha256 of
      # each one, and a target with no build is left out entirely. The
      # binaries live in agent/bin, which is gitignored, so the checkout
      # above leaves them alone.
      - name: Write versions.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          KANAME_REGISTRY: ${{ needs.version.outputs.registry }}
        run: |
          args=("$VERSION")
          # The facts about this release — breaking, destructive, the
          # config keys it adds — are release.json as it was at the tag.
          # main is checked out here and may already describe the next
          # release, so the file is read from the tag's tree.
          git show "$GITHUB_REF_NAME:release.json" >/tmp/release.json 2>/dev/null ||
            echo '{}' >/tmp/release.json
          args+=(--from /tmp/release.json --reset-facts)
          # A breaking release may never apply itself unattended; the tag
          # message is still honoured for anyone who wrote it there.
          case "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")" in
            *BREAKING*) args+=(--breaking) ;;
          esac
          args+=(--summary "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")")
          args+=(--notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME")
          pnpm exec tsx scripts/release-manifest.mjs "${args[@]}"

      # Before the manifest is published, not after: the moment main
      # carries it, every running instance can read agent URLs that
      # point at this release's assets.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          assets=(agent/bin/kanamed-linux-amd64 agent/bin/kanamed-linux-arm64)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
            exit 0
          fi
          args=("$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes)
          case "$VERSION" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "${args[@]}" "${assets[@]}"

      # install.sh is served from main and pins the version it installs,
      # so a release that does not move that constant is invisible to
      # everyone installing fresh. A prerelease deliberately does not
      # become the default.
      - name: Point main at this release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) echo "prerelease: leaving install.sh pinned to the last stable" ;;
            *) sed -i -E "s/^KANAME_DEFAULT_VERSION=\"[^\"]*\"/KANAME_DEFAULT_VERSION=\"$VERSION\"/" install.sh ;;
          esac

          # release.json goes back to its defaults in the same commit: the
          # facts it carried were this release's, not the next one's.
          if git diff --quiet -- versions.json install.sh release.json; then
            echo "main already describes $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json install.sh release.json
          git commit -m "chore(release): $VERSION"
          git push origin HEAD:main
