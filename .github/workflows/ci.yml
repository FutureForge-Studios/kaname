# ==================================================================
# Every push to main and every pull request.
#
# `pnpm verify` is the same command a developer runs locally, so a
# green checkout and a green pipeline cannot disagree about what
# "green" means.
# ==================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: action-setup reads packageManager from
      # package.json, so the lockfile and the CI pnpm stay in step.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh is piped into a root shell on other people's
      # servers. Nothing it reports is treated as advisory.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh infra/*.sh

  # The release manifest is built from release.json, and the hard rule
  # on unattended updates runs on what it says. A pull request that adds
  # a migration without touching it is a release that will describe
  # that migration as harmless.
  release-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A migration must be described in release.json
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" HEAD)"
          if printf '%s\n' "$changed" | grep -q '^packages/db/drizzle/' &&
            ! printf '%s\n' "$changed" | grep -qx 'release.json'; then
            echo "packages/db/drizzle changed but release.json did not."
            echo "Say what the migration is: destructive, adds_config, min_upgrade_from."
            exit 1
          fi
