# ==================================================================
# Every push to main and every pull request.
#
# `pnpm verify` is the same command a developer runs locally, so a
# green checkout and a green pipeline cannot disagree about what
# "green" means.
# ==================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: action-setup reads packageManager from
      # package.json, so the lockfile and the CI pnpm stay in step.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The agent is Rust (KD-033). rustfmt and clippy are part of what
      # `pnpm verify` runs, so they are installed as components here.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh is piped into a root shell on other people's
      # servers. Nothing it reports is treated as advisory.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh infra/*.sh scripts/*.sh

      # `kaname` (infra/kaname.sh) draws exactly what the installer
      # draws. The block between the markers is copied, not shared at
      # runtime, so a fix made to one copy has to reach the other.
      - name: install.sh and kaname.sh share one terminal UI
        run: |
          block() { sed -n '/^# ---- kaname ui: begin ----$/,/^# ---- kaname ui: end ----$/p' "$1"; }
          [ "$(block install.sh | wc -l)" -gt 100 ] || { echo "no ui block in install.sh"; exit 1; }
          diff -u <(block install.sh) <(block infra/kaname.sh)

      - name: Both parse as POSIX sh
        run: |
          sudo apt-get install -y -qq dash >/dev/null
          for f in install.sh infra/*.sh; do dash -n "$f"; sh -n "$f"; done

  # `sudo kaname update` against real containers on a real systemd host:
  # install.sh installs one release built from this checkout, the update
  # to the next goes through the panel, the published 0.2.0 (which has
  # no server console) goes the direct path, and a build that never
  # comes up is rolled back on both paths. See scripts/updater-e2e.sh.
  updater-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Build the images from this checkout
        run: |
          docker build -f infra/Dockerfile.control-plane \
            --build-arg KANAME_VERSION=9.0.0 -t kaname-e2e/control-plane .
          docker build -f infra/Dockerfile.web \
            --build-arg KANAME_CONTROL_PLANE_URL=http://control-plane:4000 -t kaname-e2e/web .

      - name: install.sh, then kaname update
        run: |
          sudo env E2E_CP_IMAGE=kaname-e2e/control-plane E2E_WEB_IMAGE=kaname-e2e/web \
            E2E_LEGACY=0.2.0 sh scripts/updater-e2e.sh

      - name: What the host unit wrote
        if: failure()
        run: sudo journalctl -u kaname-update.service --no-pager -n 300 || true

  # The release manifest is built from release.json, and the hard rule
  # on unattended updates runs on what it says. A pull request that adds
  # a migration without touching it is a release that will describe
  # that migration as harmless.
  release-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A migration must be described in release.json
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" HEAD)"
          if printf '%s\n' "$changed" | grep -q '^packages/db/drizzle/' &&
            ! printf '%s\n' "$changed" | grep -qx 'release.json'; then
            echo "packages/db/drizzle changed but release.json did not."
            echo "Say what the migration is: destructive, adds_config, min_upgrade_from."
            exit 1
          fi
