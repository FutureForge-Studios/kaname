# ==================================================================
# Every push to main and every pull request.
#
# `pnpm verify` is the same command a developer runs locally, so a
# green checkout and a green pipeline cannot disagree about what
# "green" means.
# ==================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: action-setup reads packageManager from
      # package.json, so the lockfile and the CI pnpm stay in step.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The agent is Rust (KD-033). rustfmt and clippy are part of what
      # `pnpm verify` runs, so they are installed as components here.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh is piped into a root shell on other people's
      # servers. Nothing it reports is treated as advisory.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh infra/*.sh

  # The release manifest is built from release.json, and the hard rule
  # on unattended updates runs on what it says. A pull request that adds
  # a migration without touching it is a release that will describe
  # that migration as harmless.
  release-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A migration must be described in release.json
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" HEAD)"
          if printf '%s\n' "$changed" | grep -q '^packages/db/drizzle/' &&
            ! printf '%s\n' "$changed" | grep -qx 'release.json'; then
            echo "packages/db/drizzle changed but release.json did not."
            echo "Say what the migration is: destructive, adds_config, min_upgrade_from."
            exit 1
          fi

  # Kaname Desktop (apps/desktop): the Tauri v2 client. Its Rust crate
  # is standalone (not the agent's), and Tauri links against WebKitGTK,
  # so the system libraries are installed here rather than in `verify`.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-desktop-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Frontend typecheck, test, build
        run: |
          pnpm --filter @kaname/desktop typecheck
          pnpm --filter @kaname/desktop test
          pnpm --filter @kaname/desktop build

      # The frontend build above fills apps/desktop/dist, which Tauri's
      # build script requires to exist.
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
