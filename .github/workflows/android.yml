# ==================================================================
# The Android client (android/). A standalone Gradle project, so it
# runs only when it, or this file, changes: the TypeScript/Rust gate
# in ci.yml does not depend on it and should not wait for it.
# ==================================================================
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK; this pins the cmdline
      # tools and accepts licences so AGP can fetch the platform it needs.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lint

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: kaname-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
